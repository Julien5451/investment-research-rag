[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "investment-research-qa"
version = "0.1.0"
description = "Page-cited PDF research Q&A with local persistent retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-chroma>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "chromadb>=1.0,<2",
  "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
demo = ["streamlit>=1.66,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
